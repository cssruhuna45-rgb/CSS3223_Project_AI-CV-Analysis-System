# Full stack: database, AI service, backend, frontend.
#
#   docker compose up --build
#   http://localhost:3000
#
# Needs GEMINI_API_KEY, INTERNAL_API_KEY and JWT_SECRET in a .env file
# beside this one - copy .env.example.

services:

  # ------------------------------------------------------------------
  # 1. PostgreSQL
  # ------------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ai_interview_db
    ports:
      # Published so psql and scripts/show-schema.sql still work from
      # the host. Nothing else needs it.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # 2. FastAPI AI service
  #
  # Deliberately NOT published to the host. Only the backend needs to
  # reach it, over the compose network, with the shared internal key.
  # Publishing 8000 would put every AI endpoint - and the Gemini bill
  # behind it - on the machine's network interface.
  # ------------------------------------------------------------------
  ai-service:
    build: ./ai-service
    container_name: interview_ai_service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      AI_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      # The Chroma index is expensive to rebuild and is derived from
      # documents/, so it outlives the container.
      - chroma_data:/app/chroma_db

  # ------------------------------------------------------------------
  # 3. Spring Boot backend
  # ------------------------------------------------------------------
  backend-service:
    build: ./backend
    container_name: interview_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ai_interview_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      # Uploaded CVs; the database only stores their paths.
      - resume_uploads:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      ai-service:
        # Waiting for healthy means the backend never starts against an
        # AI service that is still loading its embedding model.
        condition: service_healthy

  # ------------------------------------------------------------------
  # 4. React frontend
  #
  # The browser calls the backend on localhost:8080 directly, which is
  # why that port is published; nginx here only serves static files.
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the JavaScript bundle at build time. Point it at
        # the machine's address instead of localhost when the browser
        # runs somewhere other than the Docker host.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    container_name: interview_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend-service:
        condition: service_started

volumes:
  postgres_data:
  chroma_data:
  resume_uploads:
