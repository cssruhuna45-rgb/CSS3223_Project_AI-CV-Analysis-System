# Full stack: database, Redis, AI service, backend, frontend.
#
#   docker compose up --build
#   http://localhost:3000
#
# Needs GEMINI_API_KEY, INTERNAL_API_KEY and JWT_SECRET in a .env file
# beside this one - copy .env.example.

services:

  # ------------------------------------------------------------------
  # 1. PostgreSQL
  # ------------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ai_interview_db
    ports:
      # Published so psql and scripts/show-schema.sql still work from
      # the host. Nothing else needs it.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # 2. Redis - interviews in progress
  #
  # Holds the working state of live interviews for the AI service, so
  # restarting that service (or running more than one copy of it) no
  # longer loses an interview halfway through. Each session expires
  # after SESSION_IDLE_TTL_SECONDS without use.
  #
  # Nothing is written to disk: a session carries the candidate's CV
  # text, and the durable record is in PostgreSQL anyway. If memory
  # fills, the session closest to expiring goes first. Not published
  # to the host; only the AI service talks to it.
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: interview_redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # 3. FastAPI AI service
  #
  # Deliberately NOT published to the host. Only the backend needs to
  # reach it, over the compose network, with the shared internal key.
  # Publishing 8000 would put every AI endpoint - and the Gemini bill
  # behind it - on the machine's network interface.
  # ------------------------------------------------------------------
  ai-service:
    build: ./ai-service
    container_name: interview_ai_service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      AI_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # The Chroma index is expensive to rebuild and is derived from
      # documents/, so it outlives the container.
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # 4. Spring Boot backend
  # ------------------------------------------------------------------
  backend-service:
    build: ./backend
    container_name: interview_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ai_interview_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ai-interview.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    volumes:
      # Uploaded CVs; the database only stores their paths.
      - resume_uploads:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      ai-service:
        # Waiting for healthy means the backend never starts against an
        # AI service that is still loading its embedding model.
        condition: service_healthy

  # ------------------------------------------------------------------
  # 5. React frontend
  #
  # The browser uses port 3000 for pages and API requests; nginx
  # forwards /api/ to the backend over the internal Docker network.
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Inlined at build time. / uses the same-origin nginx proxy.
        # Override only when using a separately hosted backend.
        # Local development without Docker still defaults to port 8080.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/}
    container_name: interview_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend-service:
        condition: service_started

volumes:
  postgres_data:
  chroma_data:
  resume_uploads:

# --------------------------------------------------------------------
# The network every service shares.
#
# IPv6 is on because a Docker network without it cannot reach an
# IPv6-only internet. On a Wi-Fi network that hands out no IPv4 address
# (Windows shows a 169.254.x.x "Autoconfiguration IPv4 Address" and an
# IPv6-only DNS server), DNS inside the container returns only AAAA
# records for generativelanguage.googleapis.com - and an IPv4-only
# bridge has no route to them. Every Gemini call then dies as
# "Resume analysis failed: [Errno 101] Network is unreachable", which
# reads like an application bug and is not one.
#
# Docker allocates the IPv6 subnet itself, and this changes nothing on
# a normal dual-stack network: containers keep their IPv4 addresses and
# still reach each other by service name.
networks:
  default:
    enable_ipv6: true
