<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vynterva AI — CV Insights & Interview Preparation</title>
  <meta name="description" content="Understand your CV, practise technical interviews, and turn feedback into a focused learning plan with Vynterva AI." />
  <link rel="icon" href="%PUBLIC_URL%/logo-mark.png" />
  <!-- Apply a saved light/dark choice before anything is drawn, so the
       page never flashes the other theme while React loads. Without a
       saved choice, index.css follows the system setting. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
