server {
    # 3000 to match the port the app is developed on, so the URL people
    # already have in their browser history keeps working.
    listen 3000;
    # IPv6 too: inside the container /etc/hosts maps localhost to ::1
    # as well as 127.0.0.1, so a client that tries IPv6 first gets
    # connection refused from an IPv4-only listener.
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser requests on the frontend origin; reach Spring over Docker.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend-service:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React Router owns the paths. Without this fallback, opening
    # /home or /scorecard directly - or reloading either - asks nginx
    # for a file that does not exist and returns 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build output never changes under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a browser keeps loading an old
    # build that points at asset filenames the new deploy no longer has.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
