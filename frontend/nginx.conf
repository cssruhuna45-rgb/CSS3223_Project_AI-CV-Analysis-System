server {
    # 3000 to match the port the app is developed on, so the URL people
    # already have in their browser history keeps working.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths. Without this fallback, opening
    # /home or /scorecard directly - or reloading either - asks nginx
    # for a file that does not exist and returns 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build output never changes under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a browser keeps loading an old
    # build that points at asset filenames the new deploy no longer has.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
