# Frontend tests and production build.
#
# Node 20, the same as frontend/Dockerfile. The build runs with
# CI=false, as the Dockerfile does, so a lint warning is reported but
# does not fail a build that Docker would accept.

name: Frontend CI

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Test and build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      - name: Production build
        run: npm run build
        env:
          CI: 'false'
