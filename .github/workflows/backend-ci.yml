# Backend build, tests and container image.
#
# Java 23 is the project baseline and is set in exactly three places:
# backend/pom.xml (java.version), backend/Dockerfile (both stages) and
# the JDK below. If one of them moves, move all of them - a mismatch
# here is invisible until a class compiled against a newer API fails
# at runtime inside the 23 runtime image.

name: Backend CI

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Build and test (Java 23)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Report toolchain
        run: |
          java -version
          ./mvnw -version

      # verify runs compile, the unit tests and the Spring Boot
      # repackage, so a broken jar fails here rather than at deploy.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      # The jar having been built by a 23 JDK is not the same as it
      # targeting 23. 67 is the class file major version for Java 23;
      # anything else means the compiler release and this workflow have
      # drifted apart.
      - name: Check bytecode targets Java 23
        run: |
          major=$(javap -v -p target/classes/com/aiinterview/AiInterviewApplication.class \
                  | awk '/major version/ {print $3}')
          echo "class file major version: $major"
          if [ "$major" != "67" ]; then
            echo "::error::Expected major version 67 (Java 23), found $major"
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Build only. Publishing needs registry credentials this
      # repository does not currently hold.
      - name: Build backend image
        run: docker build --no-cache -t springboot-java23 ./backend

      - name: Check the runtime image is Java 23
        run: |
          docker run --rm --entrypoint java springboot-java23 -version 2>&1 | tee version.txt
          grep -q '"23' version.txt || {
            echo "::error::Runtime image is not Java 23"
            exit 1
          }
